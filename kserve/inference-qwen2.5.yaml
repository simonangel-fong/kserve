# inference.yaml
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-llm
  namespace: llm
spec:
  predictor:
    # The gpu NodePool taints its nodes; without this the pod stays Pending
    # while Karpenter declines to provision for it.
    tolerations:
      - key: nvidia.com/gpu
        effect: NoSchedule
        operator: Exists

    model:
      modelFormat:
        name: huggingface

      # --model_name is what clients send as "model" in the request body.
      args:
        - --model_name=qwen

      storageUri: "hf://Qwen/Qwen2.5-0.5B-Instruct"

      resources:
        requests:
          cpu: "1"
          memory: 4Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "2"
          memory: 6Gi
          # GPUs are not shareable; requests and limits must match.
          nvidia.com/gpu: "1"
