# karpenter.yaml
# Karpenter controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 01-karpenter
  namespace: argocd
spec:
  project: default

  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.14.0"

    helm:
      valuesObject:
        settings:
          clusterName: kserve-dev
          clusterEndpoint: https://809A851E5891111FE59D6337B59622BD.gr7.us-east-1.eks.amazonaws.com
          interruptionQueue: Karpenter-kserve-dev

        nodeSelector:
          role: bootstrap

        # The two t3.medium bootstrap nodes have 1930m allocatable each, ~680m
        # of it free after system pods. A single replica is all that fits, and
        # HA buys nothing here - the second replica could not schedule anyway.
        replicas: 1

        controller:
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
