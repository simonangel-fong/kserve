# karpenter.yaml
# Karpenter controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default

  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.14.0"

    helm:
      valuesObject:
        settings:
          clusterName: kserve-dev
          # clusterEndpoint: https://809A851E5891111FE59D6337B59622BD.gr7.us-east-1.eks.amazonaws.com
          interruptionQueue: Karpenter-kserve-dev

        nodeSelector:
          role: bootstrap

        controller:
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
