# open-webui.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default

  source:
    repoURL: https://helm.openwebui.com
    chart: open-webui
    targetRevision: "15.2.0"

    helm:
      valuesObject:
        ollama:
          enabled: false
        pipelines:
          enabled: false

        websocket:
          enabled: true
          manager: ""
          redis:
            enabled: false

        replicaCount: 1

        # No PVC
        persistence:
          enabled: false

        # No nodeSelector: unlike cert-manager and the KServe controller, this
        # is an application rather than cluster infrastructure, so let the
        # Karpenter general NodePool provision capacity for it.

        # The chart ships no probes, so a wedged pod stays in the Service
        # endpoints and a rollout reports success before the app is up.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 30
        # Readiness uses /health/db, per the chart's documented example: it
        # gates traffic on the database being reachable, not just the process.
        readinessProbe:
          httpGet:
            path: /health/db
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 3

        # KServe's huggingface runtime serves an OpenAI-compatible API.
        # Path is /openai/v1 on the predictor Service in the llm namespace.
        enableOpenaiApi: true
        openaiBaseApiUrls:
          - "http://qwen-llm-predictor.llm.svc.cluster.local/openai/v1"
        # KServe does not check this, but the chart requires one key per URL.
        openaiApiKeys:
          - "kserve-no-auth"

        service:
          type: ClusterIP
          port: 80

        resources:
          requests:
            cpu: "200m"
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
