# Karpenter EC2NodeClasses + NodePools
#
# Two tiers:
#   general - t/m instances, everyday workloads. Untainted, so anything lands here.
#   gpu     - g4dn instances, model serving. Tainted; only pods that tolerate
#             nvidia.com/gpu get scheduled onto them.
#
# To schedule onto the GPU tier, a pod needs both the toleration and a
# resource request:
#   tolerations:
#     - key: nvidia.com/gpu
#       effect: NoSchedule
#       operator: Exists
#   resources:
#     limits:
#       nvidia.com/gpu: 1
---
# How to build a general node: AMI, IAM role, subnets, security groups.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: general
spec:
  role: kserve-dev-karpenter-node

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: kserve-dev

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: kserve-dev

  tags:
    karpenter.sh/discovery: kserve-dev
---
# GPU nodes need the accelerated AL2023 AMI - it ships the NVIDIA driver and
# container runtime hook. There is no `alias` for it (aliases only cover the
# standard variants), so it is resolved by its EKS-published SSM parameter.
# Pinned to the cluster's Kubernetes version - bump alongside eks_version.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: kserve-dev-karpenter-node

  # amiSelectorTerms without an alias leaves amiFamily unset, and Karpenter
  # needs it to generate the right UserData.
  amiFamily: AL2023

  amiSelectorTerms:
    - ssmParameter: /aws/service/eks/optimized-ami/1.36/amazon-linux-2023/x86_64/nvidia/recommended/image_id

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: kserve-dev

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: kserve-dev

  # Container images for model serving are large; the 20Gi default fills up.
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true

  tags:
    karpenter.sh/discovery: kserve-dev
---
# Tier 1: general purpose. Burstable (t) and balanced (m) instances.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        # Keep the blast radius of a single node small.
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4", "8"]

      # Recycle nodes after 30 days so they pick up fresh AMIs.
      expireAfter: 720h

  # Cap on everything this pool has launched, summed.
  limits:
    cpu: 100

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
# Tier 2: GPU. g4dn (T4) instances for inference.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        node-role: gpu
        # The nvidia-device-plugin daemonset selects on this label.
        nvidia.com/gpu.present: "true"

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu

      # Only pods that explicitly tolerate this land on a GPU node - otherwise
      # ordinary workloads would happily occupy hardware they cannot use.
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g4dn"]
        # Single-GPU sizes only; multi-GPU boxes are a large jump in cost.
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1"]

      expireAfter: 720h

  # Two g4dn.xlarge worth of headroom.
  limits:
    cpu: 32
    nvidia.com/gpu: 2

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # GPU pods are slow to start; give them longer before reclaiming the node.
    consolidateAfter: 5m
