# Karpenter NodePool + EC2NodeClass.
#
# Split from the karpenter Application because these are custom resources whose
# CRDs the chart installs. The sync wave holds them back until the controller
# Application (wave 0) has landed those CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepool
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/simonangel-fong/kserve.git
    targetRevision: master
    path: argocd/manifests/karpenter

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # The CRDs may not be established on the first attempt.
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
