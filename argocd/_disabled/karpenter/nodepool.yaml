# Karpenter NodePool + EC2NodeClass
#
# PARKED - not synced. Lives outside argocd/apps/, so the root Application
# ignores it. Karpenter's controller runs without these but provisions no nodes.
#
# To enable: substitute the placeholders below, move this directory and
# ../karpenter-nodepool.yaml into argocd/apps/, then commit.
#   NODE_IAM_ROLE  -> kserve-dev-karpenter-node
#   DISCOVERY      -> kserve-dev
---
# How to build a node: AMI, IAM role, subnets, security groups.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: NODE_IAM_ROLE

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: DISCOVERY

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: DISCOVERY

  tags:
    karpenter.sh/discovery: DISCOVERY
---
# What Karpenter may launch, and when to reclaim it.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]

      # Recycle nodes after 30 days so they pick up fresh AMIs.
      expireAfter: 720h

  # Cap on everything this pool has launched, summed.
  limits:
    cpu: 100

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
